name: Validate SAEID SPORTS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          cp app.js /tmp/saeid-sports-app.mjs
          node --check /tmp/saeid-sports-app.mjs
      - name: Reject unfinished user-facing markers
        run: |
          if grep -RniE 'Coming Soon|TODO|Lorem ipsum|Demo only|Mock content' --exclude-dir=.git --exclude='*.yml' --exclude='*.yaml' .; then
            echo 'Unfinished marker found.'
            exit 1
          fi
          if grep -RniE '>\s*PLACEHOLDER\s*<' --include='*.html' --include='*.js' .; then
            echo 'User-facing placeholder content found.'
            exit 1
          fi
      - name: Check required upgrade assets
        run: |
          test -s app.js
          test -s styles.css
          test -s museum-upgrade.css
          test -s ASSET_SOURCES.md
          grep -q 'Gallery' app.js
          grep -q 'Wikimedia Commons' app.js
          grep -Eq 'equipment-inspector|model-viewer' app.js
          grep -q 'GLTFLoader' app.js
          grep -q 'cdn.3dassets.dev' app.js
          grep -q 'devicePixelRatio,mobile?1.1:1.5' app.js
