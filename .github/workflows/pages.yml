name: Deploy SAEID SPORTS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore original athlete model
        shell: bash
        run: |
          set -euo pipefail
          # Keep the checked-in optimized model for fast/mobile rendering.
          test -s assets/models/center-athlete.glb
          # Rebuild the original high-detail model as a separate desktop upgrade.
          cat .modelparts/part-*.gzpart > /tmp/center-athlete-hq.glb.gz
          gzip -dc /tmp/center-athlete-hq.glb.gz > assets/models/center-athlete-hq.glb
          echo "51a94baa1c114a327fd68d8cc918b90fcf1316394a1998cfc09524b60e2da8e9  assets/models/center-athlete-hq.glb" | sha256sum -c -
          test "$(stat -c%s assets/models/center-athlete-hq.glb)" -eq 24612680
          rm -rf .modelparts
          rm -f /tmp/center-athlete-hq.glb.gz

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
